[package]
name = "weaver"
version = "0.1.0"
edition = "2021"

[dependencies]
num-traits = "0.2.19"
anyhow = "1.0.104"
pic-scale = { version = "0.7.12", default-features = false, features = ["nightly_f16"] }
bytemuck = { version = "1.25.2", features = ["nightly_float"] }
moxcms = { version = "0.9.1", default-features = false }
gainforge = "0.5.1"
thiserror = "2.0.21"
libc = "1.0.0-alpha.5"
log = "0.4.34"
jxl = { git = "https://github.com/libjxl/jxl-rs.git", rev = "d7a831fae15b903f1b56a76668030c19ac07bb6f", default-features = false }
yuv = { version = "0.8.19", default-features = false, features = ["nightly_f16"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
ndk-sys = "0.6.0"
android_logger = { version = "0.15.1", optional = true }   # pulled in only by `logging`

[target.'cfg(any(target_arch = "aarch64", target_arch = "arm"))'.dependencies]
jixel = { version = "0.5.2", default-features = false }

[features]
rdm = ["pic-scale/rdm", "moxcms/neon_shaper_fixed_point_paths", "jixel/neon", "jxl/neon"]
i8mm = ["pic-scale/nightly_i8mm"]
sve = ["pic-scale/sve"]
logging = ["dep:android_logger"]

[lib]
crate-type = ["cdylib", "staticlib"]

[profile.release]
strip = "symbols"
debug = 0
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
incremental = false

[build-dependencies]
cbindgen = "0.29.4"
